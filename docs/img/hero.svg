 text-anchor="middle" class="f-card" >✓</text><text x="912" y="354" font-size="15" font-weight="600" text-anchor="start" class="f-ink" >Sent to Priya Rao (Legal) for sign-off</text><text x="912" y="374" font-size="13" font-weight="400" text-anchor="start" class="f-mut" >nothing is cleared until she approves</text></svg>