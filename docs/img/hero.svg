<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"><title>ClaimTrail: finds every claim in an ad, checks it, cites the proof, and routes it to a named person for sign-off</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.f-bg{fill:#f6f8fa}.s-bg{stroke:#f6f8fa}.f-card{fill:#ffffff}.s-card{stroke:#ffffff}.f-edge{fill:#d0d7de}.s-edge{stroke:#d0d7de}.f-ink{fill:#1f2328}.s-ink{stroke:#1f2328}.f-mut{fill:#59636e}.s-mut{stroke:#59636e}.f-line{fill:#8c959f}.s-line{stroke:#8c959f}.f-acc{fill:#c2410c}.s-acc{stroke:#c2410c}.f-blue{fill:#0969da}.s-blue{stroke:#0969da}.f-red{fill:#cf222e}.s-red{stroke:#cf222e}.f-amber{fill:#9a6700}.s-amber{stroke:#9a6700}.f-green{fill:#1a7f37}.s-green{stroke:#1a7f37}.f-purple{fill:#8250df}.s-purple{stroke:#8250df}.f-soft{fill:#eef1f4}.s-soft{stroke:#eef1f4}.f-redsoft{fill:#ffebe9}.s-redsoft{stroke:#ffebe9}.f-ambersoft{fill:#fff8c5}.s-ambersoft{stroke:#fff8c5}.f-bluesoft{fill:#ddf4ff}.s-bluesoft{stroke:#ddf4ff}.f-purplesoft{fill:#fbefff}.s-purplesoft{stroke:#fbefff}@media (prefers-color-scheme:dark){.f-bg{fill:#161b22}.s-bg{stroke:#161b22}.f-card{fill:#0d1117}.s-card{stroke:#0d1117}.f-edge{fill:#3d444d}.s-edge{stroke:#3d444d}.f-ink{fill:#e6edf3}.s-ink{stroke:#e6edf3}.f-mut{fill:#9198a1}.s-mut{stroke:#9198a1}.f-line{fill:#6e7681}.s-line{stroke:#6e7681}.f-acc{fill:#f0883e}.s-acc{stroke:#f0883e}.f-blue{fill:#4493f8}.s-blue{stroke:#4493f8}.f-red{fill:#f85149}.s-red{stroke:#f85149}.f-amber{fill:#d29922}.s-amber{stroke:#d29922}.f-green{fill:#3fb950}.s-green{stroke:#3fb950}.f-purple{fill:#ab7df8}.s-purple{stroke:#ab7df8}.f-soft{fill:#21262d}.s-soft{stroke:#21262d}.f-redsoft{fill:#3c1618}.s-redsoft{stroke:#3c1618}.f-ambersoft{fill:#3a2a06}.s-ambersoft{stroke:#3a2a06}.f-bluesoft{fill:#0c2d4a}.s-bluesoft{stroke:#0c2d4a}.f-purplesoft{fill:#2c1a47}.s-purplesoft{stroke:#2c1a47}}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-line"/></marker></defs><rect x="0.5" y="0.5" width="1199" height="399" rx="16" class="f-bg s-edge"/><text x="56" y="84" font-size="13" font-weight="700" text-anchor="start" class="f-acc" letter-spacing="2">AGENTIC PRE-SCREEN FOR INDIAN ADS</text><text x="54" y="150" font-size="60" font-weight="700" text-anchor="start" class="f-ink" >ClaimTrail</text><text x="56" y="196" font-size="24" font-weight="500" text-anchor="start" class="f-ink" >Every claim found, checked and cited.</text><text x="56" y="228" font-size="18" font-weight="400" text-anchor="start" class="f-mut" >No ad is cleared without a named person's sign-off.</text><text x="56" y="284" font-size="16" font-weight="400" text-anchor="start" class="f-ink" >Reels · statics · voiceovers · influencer scripts</text><text x="56" y="312" font-size="16" font-weight="400" text-anchor="start" class="f-ink" >हिन्दी · தமிழ் · తెలుగు · English</text><text x="56" y="368" font-size="12" font-weight="400" text-anchor="start" class="f-mut" >Illustration · invented brand and people</text><defs><linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7da"/><stop offset="1" stop-color="#ffb08a"/></linearGradient></defs><rect x="648" y="34" width="184" height="332" rx="28" class="f-ink" stroke-width="1" /><rect x="656" y="42" width="168" height="316" rx="21" fill="url(#scr)"/><text x="672" y="72" font-size="14" font-weight="800" fill="#7c2d12">GlowCo</text><circle cx="740" cy="136" r="34" fill="#f6c6ad"/><path d="M686 214 q54 -64 108 0 v10 h-108 z" fill="#f6c6ad"/><text x="782" y="104" font-size="18" fill="#ffffff">✦</text><text x="740" y="258" font-size="26" font-weight="800" text-anchor="middle" fill="#7c2d12">Glow in</text><text x="740" y="288" font-size="26" font-weight="800" text-anchor="middle" fill="#7c2d12">7 days</text><rect x=